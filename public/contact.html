<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Djamel Stoyloff</title>
</head>
<body>

<header>
    <h1>Contact Me</h1>
    <nav>
        <a href="about.html">About</a> |
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <p>
        If you would like to get in touch regarding professional opportunities,
        collaborations or questions about my work, feel free to send a message.
    </p>

    <form action="#" method="post">
        <div>
            <label for="name">Your Name</label><br>
            <input type="text" id="name" name="name" required>
        </div>

        <div>
            <label for="email">Your Email</label><br>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="message">Your Message</label><br>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <div>
            <button type="submit">Send Message</button>
        </div>
    </form>
</main>

<footer>
    <p>© 2026 Djamel Stoyloff</p>
</footer>

</body>
</html>
